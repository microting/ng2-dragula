name: on-pull-request

on:
  pull_request:
    branches:
      - master

jobs:
  # build ng2-dragula
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: yarn install
      - run: |
          npx nx build demo --configuration production

  # run unit tests
  unit_tests_with_coverage:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - run: yarn install
      - run: npx nx run-many --target=test --all --code-coverage
        continue-on-error: true

  # run linting
  linting:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - run: yarn install
      - run: npm run lint

  # run cypress e2e tests
  e2e_tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - run: yarn install
      - run: npx cypress install
      - name: Run Cypress e2e tests
        run: npx nx e2e demo-e2e --configuration=ci
      
      # Upload screenshots on failure
      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots
          path: dist/cypress/apps/demo-e2e/screenshots
          if-no-files-found: ignore
          retention-days: 7
      
      # Upload videos
      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: dist/cypress/apps/demo-e2e/videos
          if-no-files-found: ignore
          retention-days: 7
      
      # Upload Cypress logs
      - name: Upload Cypress logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-logs
          path: |
            dist/cypress/apps/demo-e2e/**/*.log
            dist/cypress/apps/demo-e2e/**/*.json
          if-no-files-found: ignore
          retention-days: 7
