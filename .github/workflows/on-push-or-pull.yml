name: on-pull-request

on:
  pull_request:
    branches:
      - master

jobs:
  # build ng2-dragula
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: yarn install
      - run: |
          npx nx build demo --configuration production

  # run unit tests
  unit_tests_with_coverage:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - run: yarn install
      - run: npx nx run-many --target=test --all --code-coverage
        continue-on-error: true

  # run linting
  linting:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - run: yarn install
      - run: npm run lint

  # run cypress e2e tests
  e2e_tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - run: yarn install
      - run: npx cypress install
      - name: Run Cypress e2e tests with logging
        run: |
          # Create log directories
          mkdir -p dist/cypress/apps/demo-e2e/logs
          mkdir -p dist/cypress/apps/demo-e2e/screenshots
          mkdir -p dist/cypress/apps/demo-e2e/videos
          
          # Build the ng2-dragula library first
          echo "Building ng2-dragula library..."
          npx nx build ng2-dragula
          echo "Library build complete"
          
          # Link the built library to node_modules so webpack can resolve it
          echo "Linking built library to node_modules..."
          # Create symlink directly (more reliable than npm link in CI)
          ln -s ../../dist/ng2-dragula node_modules/ng2-dragula
          echo "Library linked successfully"
          ls -la node_modules/ng2-dragula || echo "Symlink verification failed"
          
          # Start the dev server in background and capture logs
          # Use serve-ci target which uses tsconfig.serve.json to import from dist
          npx nx run demo:serve-ci --port 4200 > demo-server.log 2>&1 &
          SERVER_PID=$!
          echo "Server started with PID: $SERVER_PID"
          
          # Wait for server to be ready (check for 200 response AND actual HTML content)
          echo "Waiting for server to be ready with compiled app..."
          for i in {1..180}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 2>/dev/null || echo "000")
            CONTENT=$(curl -s http://localhost:4200 2>/dev/null || echo "")
            
            # Check if we get HTTP 200 AND the response contains the app tag (not just webpack dev server page)
            if [ "$HTTP_CODE" = "200" ] && echo "$CONTENT" | grep -q "<ex-app" ; then
              echo "Server is ready after $i seconds (HTTP $HTTP_CODE, app content found)"
              break
            fi
            if [ $i -eq 180 ]; then
              echo "Server failed to serve app within 180 seconds"
              echo "Last HTTP code: $HTTP_CODE"
              echo "Content preview: $(echo "$CONTENT" | head -c 500)"
              echo "=== Server logs ==="
              cat demo-server.log
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            if [ $((i % 15)) -eq 0 ]; then
              echo "Still waiting... ($i seconds, HTTP code: $HTTP_CODE, content length: ${#CONTENT})"
            fi
            sleep 1
          done
          
          # Run Cypress tests
          echo "Running Cypress tests..."
          cd apps/demo-e2e && npx cypress run --config baseUrl=http://localhost:4200 --spec "src/e2e/**/*.cy.ts" || TEST_EXIT_CODE=$?
          cd ../..
          
          # Capture server logs
          echo "=== Capturing server logs ==="
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          
          # Save server logs to dist for artifact upload
          if [ -f demo-server.log ]; then
            cp demo-server.log dist/cypress/apps/demo-e2e/logs/
            echo "Server logs saved"
          else
            echo "Warning: demo-server.log not found"
          fi
          
          # Exit with Cypress exit code
          exit ${TEST_EXIT_CODE:-0}
      
      # Upload screenshots on failure
      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots
          path: dist/cypress/apps/demo-e2e/screenshots
          if-no-files-found: ignore
          retention-days: 7
      
      # Upload videos
      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: dist/cypress/apps/demo-e2e/videos
          if-no-files-found: ignore
          retention-days: 7
      
      # Upload Cypress logs
      - name: Upload Cypress logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-logs
          path: |
            dist/cypress/apps/demo-e2e/**/*.log
            dist/cypress/apps/demo-e2e/**/*.json
          if-no-files-found: ignore
          retention-days: 7
      
      # Print logs to console for easier debugging
      - name: Print logs to console
        if: always()
        run: |
          echo "========================================"
          echo "=== DEMO SERVER LOGS ==="
          echo "========================================"
          if [ -f dist/cypress/apps/demo-e2e/logs/demo-server.log ]; then
            cat dist/cypress/apps/demo-e2e/logs/demo-server.log
          else
            echo "No demo-server.log found"
          fi
          
          echo ""
          echo "========================================"
          echo "=== BROWSER CONSOLE LOGS ==="
          echo "========================================"
          if [ -f dist/cypress/apps/demo-e2e/logs/browser-console.log ]; then
            cat dist/cypress/apps/demo-e2e/logs/browser-console.log
          else
            echo "No browser-console.log found"
          fi
          
          echo ""
          echo "========================================"
          echo "=== TEST EXECUTION LOGS ==="
          echo "========================================"
          if [ -f dist/cypress/apps/demo-e2e/logs/test-execution.log ]; then
            cat dist/cypress/apps/demo-e2e/logs/test-execution.log
          else
            echo "No test-execution.log found"
          fi
