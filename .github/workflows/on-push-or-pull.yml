name: on-pull-request

on:
  pull_request:
    branches:
      - master

jobs:
  # build ng2-dragula
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: yarn install
      - run: |
          npx nx build demo --configuration production

  # run unit tests
  unit_tests_with_coverage:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - run: yarn install
      - run: npx nx run-many --target=test --all --code-coverage
        continue-on-error: true

  # run linting
  linting:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - run: yarn install
      - run: npm run lint

  # run cypress e2e tests
  e2e_tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - run: yarn install
      - run: npx cypress install
      - name: Run Cypress e2e tests with logging
        run: |
          # Start the dev server in background and capture logs
          npx nx serve demo --port 4200 > demo-server.log 2>&1 &
          SERVER_PID=$!
          echo "Server started with PID: $SERVER_PID"
          
          # Wait for server to be ready
          echo "Waiting for server to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:4200 > /dev/null; then
              echo "Server is ready after $i seconds"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Server failed to start within 60 seconds"
              echo "=== Server logs ==="
              cat demo-server.log
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          
          # Run Cypress tests
          echo "Running Cypress tests..."
          npx cypress run --config baseUrl=http://localhost:4200 --spec "apps/demo-e2e/src/e2e/**/*.cy.ts" || TEST_EXIT_CODE=$?
          
          # Capture server logs
          echo "=== Capturing server logs ==="
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          
          # Save server logs to dist for artifact upload
          mkdir -p dist/cypress/apps/demo-e2e/logs
          cp demo-server.log dist/cypress/apps/demo-e2e/logs/ || true
          
          # Exit with Cypress exit code
          exit ${TEST_EXIT_CODE:-0}
      
      # Upload screenshots on failure
      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots
          path: dist/cypress/apps/demo-e2e/screenshots
          if-no-files-found: ignore
          retention-days: 7
      
      # Upload videos
      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: dist/cypress/apps/demo-e2e/videos
          if-no-files-found: ignore
          retention-days: 7
      
      # Upload Cypress logs
      - name: Upload Cypress logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-logs
          path: |
            dist/cypress/apps/demo-e2e/**/*.log
            dist/cypress/apps/demo-e2e/**/*.json
          if-no-files-found: ignore
          retention-days: 7
